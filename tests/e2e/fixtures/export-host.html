<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Texture Lab export fixture</title>
    <style>
      html,
      body {
        min-height: 100%;
        margin: 0;
        background: #f8fafc;
      }

      .fixture-frame {
        display: grid;
        min-height: 100vh;
        place-items: center;
      }

      .texture-lab-texture {
        width: 720px;
        height: 480px;
      }
    </style>
    <style id="texture-export-style"></style>
  </head>
  <body>
    <main class="fixture-frame">
      <div class="texture-lab-texture" aria-label="Rendered CSS texture"></div>
    </main>
  </body>
</html>
